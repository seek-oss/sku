name: Validate

on: [push, pull_request]

jobs:
  skip_check:
    name: Check concurrent runs
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - uses: fkirc/skip-duplicate-actions@b974a9395958c231af965b70070979a577efa578 # v5.3.2
        id: skip_check
        with:
          concurrent_skipping: same_content_newer
          cancel_others: true
          # We want to skip only concurrent runs. Subsequent runs/retries should be allowed.
          skip_after_successful_duplicate: false

  test:
    name: Test (${{ matrix.shard }}/2)
    needs: skip_check
    if: needs.skip_check.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      CI: true
    timeout-minutes: 30
    steps:
      - name: Check out Repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - id: pnpm-setup
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          cache: pnpm
          node-version-file: package.json

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Sku
        run: pnpm build

      - name: Cache babel-loader
        id: babel-loader-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: 'fixtures/*/node_modules/.cache/babel-loader'
          key: babel-loader-${{ runner.os }}-${{ hashFiles('./pnpm-lock.yaml') }}

      - name: Set up hosts
        # Couldn't get `sudo pnpm setup-test-hosts` to work
        run: sudo -E ${{ steps.pnpm-setup.outputs.bin_dest }}/pnpm setup-test-hosts

      - name: Lint
        if: matrix.shard == 1
        run: pnpm lint

      - name: Build docs
        if: matrix.shard == 1
        run: pnpm build:docs

      - name: Install Playwright Browsers
        run: pnpm exec playwright install chromium --with-deps --no-shell

      - name: Test
        run: aa-exec --profile=chrome pnpm run test --shard=${{ matrix.shard }}/2

  # Branch protection requires a single "Lint & Test" check
  # The results of this job are used to determine if the branch can be merged
  test_result:
    name: Lint & Test
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check test shards
        if: needs.test.result == 'failure' || needs.test.result == 'cancelled'
        run: exit 1
