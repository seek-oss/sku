packages:
  - site
  - tests
  - fixtures/*
  - packages/*
  - private/*

allowBuilds:
  # Postinstall only prints an optional completions tip; dist/ ships in the package.
  '@fission-ai/openspec': false
  '@swc/core': true # sku_managed
  core-js-pure: false # sku_managed
  esbuild: true # sku_managed
  unrs-resolver: true # sku_managed
  '@parcel/watcher': true # sku_managed
  sku: true # sku_managed

minimumReleaseAgeExclude:
  - '@braid-design-system/*' # sku_managed
  - '@capsizecss/*' # sku_managed
  - '@vanilla-extract/*' # sku_managed
  - '@vocab/*' # sku_managed
  - 'braid-design-system' # sku_managed
  - 'browserslist-config-seek' # sku_managed
  - 'ensure-gitignore'
  - 'eslint-config-seek' # sku_managed
  - 'renovate-config-seek'
  - '@seek/*' # sku_managed
  - '@sku-lib/*' # sku_managed
  - sku # sku_managed

dedupePeers: true

catalog:
  '@types/node': ^24.12.4
  '@types/react': ^19.2.17
  '@types/react-dom': ^19.2.3
  '@vanilla-extract/css': '^1.20.1'
  '@vanilla-extract/integration': '^8.0.9'
  '@vanilla-extract/jest-transform': '^1.1.21'
  '@vanilla-extract/vite-plugin': ^5.2.5
  '@vanilla-extract/webpack-plugin': '^2.3.26'
  '@vocab/vite': ^1.0.6
  braid-design-system: ^34.0.0
  cli-testing-library: ^4.0.0
  commander: ^14.0.1
  # 05/08/25: there is currently a bug in later versions of jiti that break eslint ts support. Pinning to 2.4.2 fixes the issue. (last checked with v2.6.1)
  # 12/11/25: Unpinning for now and using JS eslint config because jiti peer deps from other packages are causing issues. We can re-evaluate later.
  jiti: ^2.4.2
  nano-staged: ^1.0.2
  obug: ^2.1.3
  react: ^19.2.7
  react-dom: ^19.2.7
  react-router: '^8.3.0'
  typescript: ~6.0.3
  vite: ^8.0.1
  vitest: ^4.1.0
  webpack-dev-server: ^5.2.4
  webpack: ^5.109.0

ignoredBuiltDependencies:
  - core-js-pure

linkWorkspacePackages: deep

overrides:
  # Multiple versions of esbuild tend to crop up in the lockfile. Pin to a specific minor version
  # purely to reduce installation size.
  esbuild: ~0.28.0

preferWorkspacePackages: true

publicHoistPattern:
  - '@babel/*'
  - eslint # sku_managed
  - prettier # sku_managed

verifyDepsBeforeRun: warn
blockExoticSubdeps: true # sku_managed
minimumReleaseAge: 4320 # 3 days # sku_managed
strictDepBuilds: false # sku_managed
trustPolicy: off # sku_managed
trustPolicyExclude:
  - semver@6.3.1 # dependency of eslint-plugin-react # sku_managed
