packages:
  - site
  - tests
  - fixtures/*
  - packages/*
  - private/*

allowBuilds:
  # Postinstall only prints an optional completions tip; dist/ ships in the package.
  '@fission-ai/openspec': false
  '@swc/core': true # managed by sku
  core-js-pure: false # managed by sku
  esbuild: true # managed by sku
  unrs-resolver: true # managed by sku
  '@parcel/watcher': true # managed by sku
  sku: true # managed by sku

minimumReleaseAgeExclude:
  - '@braid-design-system/*' # managed by sku
  - '@capsizecss/*' # managed by sku
  - '@vanilla-extract/*' # managed by sku
  - '@vocab/*' # managed by sku
  - 'braid-design-system' # managed by sku
  - 'browserslist-config-seek' # managed by sku
  - 'ensure-gitignore'
  - 'eslint-config-seek' # managed by sku
  - 'renovate-config-seek'
  - '@seek/*' # managed by sku
  - '@sku-lib/*' # managed by sku
  - sku # managed by sku

dedupePeers: true

catalog:
  '@types/node': ^24.12.4
  '@types/react': ^19.2.17
  '@types/react-dom': ^19.2.3
  '@vanilla-extract/css': '^1.20.1'
  '@vanilla-extract/integration': '^8.0.9'
  '@vanilla-extract/jest-transform': '^1.1.21'
  '@vanilla-extract/vite-plugin': ^5.2.5
  '@vanilla-extract/webpack-plugin': '^2.3.26'
  '@vocab/vite': ^1.0.6
  braid-design-system: ^34.0.0
  cli-testing-library: ^4.0.0
  commander: ^14.0.1
  # 05/08/25: there is currently a bug in later versions of jiti that break eslint ts support. Pinning to 2.4.2 fixes the issue. (last checked with v2.6.1)
  # 12/11/25: Unpinning for now and using JS eslint config because jiti peer deps from other packages are causing issues. We can re-evaluate later.
  jiti: ^2.4.2
  nano-staged: ^1.0.2
  obug: ^2.1.3
  react: ^19.2.7
  react-dom: ^19.2.7
  react-router: '^8.3.0'
  typescript: ~6.0.3
  vite: ^8.0.1
  vitest: ^4.1.0
  webpack-dev-server: ^5.2.4
  webpack: ^5.109.0

ignoredBuiltDependencies:
  - core-js-pure

linkWorkspacePackages: deep

overrides:
  # Multiple versions of esbuild tend to crop up in the lockfile. Pin to a specific minor version
  # purely to reduce installation size.
  esbuild: ~0.28.0

preferWorkspacePackages: true

publicHoistPattern:
  - '@babel/*'
  - eslint # managed by sku
  - prettier # managed by sku

verifyDepsBeforeRun: warn
blockExoticSubdeps: true # managed by sku
minimumReleaseAge: 4320 # 3 days # managed by sku
strictDepBuilds: false # managed by sku
trustPolicy: off # managed by sku
trustPolicyExclude:
  - semver@6.3.1 # dependency of eslint-plugin-react # managed by sku
